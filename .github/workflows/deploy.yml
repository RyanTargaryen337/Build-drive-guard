name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/clone-gstack-repo-EqBMF]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: keys/app

      - name: Build React app
        run: bun run build
        working-directory: keys/app
        env:
          VITE_BASE_PATH: /Build-drive-guard/

      - name: Copy standalone HTML files into dist
        run: |
          cp keys/pitch-deck.html keys/app/dist/pitch-deck.html
          cp keys/landing.html   keys/app/dist/landing.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: keys/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
